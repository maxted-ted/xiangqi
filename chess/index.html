<style>
:root{
  --lacquer:#14201C; --lacquer2:#1E2F29; --lacquer3:#274037;
  --board1:#E7CFA3; --board2:#D8B983; --grain:#C9A874;
  --ink:#3A2E20; --cinnabar:#B23322; --jade:#4E9E7E;
  --gold:#C8A64A; --ivory:#F8F0DE; --paper:#E9DFC9;
  --serif:"Noto Serif CJK TC","Noto Serif TC","Songti TC","STSong","PMingLiU","SimSun",serif;
  --sans:"Noto Sans CJK TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(120% 60% at 50% 0%, #24382F 0%, var(--lacquer) 60%),
    var(--lacquer);
  background-attachment:fixed;
  color:var(--paper); font-family:var(--sans);
  display:flex; flex-direction:column; align-items:center;
  padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right))
          calc(12px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  overscroll-behavior:none; touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}
.wrap{width:100%;max-width:470px;display:flex;flex-direction:column;gap:10px;padding-top:10px}
.panel{display:flex;flex-direction:column;gap:10px}

/* ---- 標題 ---- */
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.22em;margin:0;color:var(--ivory)}
h1 span{color:var(--gold)}
.lvtag{font-size:12px;letter-spacing:.08em;color:#9CB3A8;border:1px solid #3A5449;border-radius:999px;padding:3px 10px;white-space:nowrap}

/* ---- 教練橫幅（招牌元素）---- */
.coach{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,var(--lacquer3),var(--lacquer2));
  border:1px solid #3C5B4E;border-left:4px solid var(--gold);
  border-radius:10px;padding:10px 12px;min-height:56px;
}
.coach b{font-family:var(--serif);font-size:22px;color:var(--gold);line-height:1;flex:none}
.coach p{margin:0;font-size:14.5px;line-height:1.5;color:var(--paper)}
.coach.alert{border-left-color:var(--cinnabar)}
.coach.alert b{color:#E8735E}
.coach.win{border-left-color:var(--jade)} .coach.win b{color:#7BD3B0}

/* ---- 棋盤 ---- */
.boardbox{position:relative;width:100%;aspect-ratio:1/1;border-radius:8px;overflow:hidden;
  box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 0 1px #4A3A26 inset;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@supports not (aspect-ratio:1/1){ .boardbox{height:0;padding-bottom:100%} }
.boardbox svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:3%;cursor:pointer}
.pc{
  position:absolute;width:12.5%;height:12.5%;transform:translate(-50%,-50%);
  pointer-events:none;
  transition:left .22s cubic-bezier(.4,1.4,.5,1), top .22s cubic-bezier(.4,1.4,.5,1);
}
.pc svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.45))}
.pc.sel svg{filter:drop-shadow(0 0 3px var(--gold)) drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.pc.flip{transform:translate(-50%,-50%) rotate(180deg)}
.pc.lift{z-index:3}
.sq{position:absolute;width:12.5%;height:12.5%;transform:translate(-50%,-50%);pointer-events:none}
.mark{background:rgba(200,166,74,.38);box-shadow:inset 0 0 0 2px rgba(200,166,74,.8)}
.selsq{background:rgba(78,158,126,.35);box-shadow:inset 0 0 0 3px var(--gold)}
.hint{box-shadow:inset 0 0 0 4px var(--jade);background:rgba(78,158,126,.22)}
.chk{background:radial-gradient(circle,rgba(178,51,34,.95) 0%,rgba(178,51,34,.55) 45%,rgba(178,51,34,0) 72%);
  animation:warn .8s ease-in-out infinite}
@keyframes warn{0%,100%{opacity:1}50%{opacity:.45}}
.dot{position:absolute;width:3.6%;aspect-ratio:1/1;border-radius:50%;transform:translate(-50%,-50%);
  background:var(--jade);opacity:.9;pointer-events:none;box-shadow:0 0 0 2px rgba(20,32,28,.18)}
.ring{position:absolute;width:11.4%;aspect-ratio:1/1;border-radius:50%;transform:translate(-50%,-50%);
  border:4px solid var(--jade);pointer-events:none;opacity:.9}

/* ---- 控制列 ---- */
.row{display:flex;gap:8px}
button.ui{
  flex:1;font-family:var(--sans);font-size:14px;color:var(--paper);
  background:linear-gradient(180deg,#26382F,#1A2822);
  border:1px solid #3E5B4E;border-radius:10px;padding:11px 6px;min-height:46px;cursor:pointer;
}
button.ui:active{transform:translateY(1px)}
button.ui:disabled{opacity:.4}
button.ui.primary{background:linear-gradient(180deg,#8E2B1D,#6D1F14);border-color:#B23322;color:#FFE9E2}
button.ui:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---- 棋譜 ---- */
.log{background:#101A16;border:1px solid #2E463C;border-radius:10px;padding:8px 10px;
  max-height:86px;overflow:auto;font-size:13px;line-height:1.7;-webkit-overflow-scrolling:touch}
.log div{display:flex;gap:8px}
.log i{font-style:normal;color:#6E877C;width:30px;flex:none;text-align:right}
.log span{min-width:64px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13.5px}
.log .ww{color:var(--ivory)} .log .bb{color:#9FBFB0}
.log em{font-style:normal;color:#5F776C}

/* ---- 圖鑑／選單 ---- */
.sheet{position:fixed;inset:0;background:rgba(6,12,10,.7);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sheet .inner{width:100%;max-width:640px;max-height:82vh;overflow:auto;background:var(--lacquer2);
  border-top:2px solid var(--gold);border-radius:16px 16px 0 0;
  padding:16px 16px calc(28px + env(safe-area-inset-bottom))}
.sheet h2{font-family:var(--serif);letter-spacing:.16em;font-size:17px;margin:0 0 12px;color:var(--gold)}
.sheet .sub{margin:-4px 0 12px;font-size:13.5px;color:#B9CCC2;line-height:1.6}
.card{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #2E463C}
.card:last-of-type{border-bottom:0}
.chip{flex:none;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:700;font-size:22px;color:var(--cinnabar);
  background:radial-gradient(circle at 32% 28%,#FFFAF0,#DCCBA8);box-shadow:inset 0 0 0 1.5px rgba(178,51,34,.5)}
.chip svg{width:40px;height:40px}
.card h3{margin:0 0 3px;font-size:15px;color:var(--ivory)}
.card p{margin:0;font-size:13.5px;line-height:1.6;color:#B9CCC2}
.card .k{color:var(--gold)}
.close{width:100%;margin-top:14px}
.picks{display:flex;gap:10px}
.picks button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px}
.picks svg{width:54px;height:54px}

/* ---- 寬螢幕：iPad 直向 ---- */
@media (min-width:640px) and (min-height:860px){
  .wrap{max-width:620px}
  .log{max-height:140px}
}
/* ---- 寬螢幕：桌機／iPad 橫向，棋盤在左、控制在右 ---- */
@media (min-width:700px) and (min-aspect-ratio:5/4){
  body{justify-content:center;min-height:100vh}
  .wrap{
    --bsz:min(calc(100vh - 36px - env(safe-area-inset-top) - env(safe-area-inset-bottom)), calc(100vw - 420px), 860px);
    max-width:none;width:auto;display:grid;column-gap:22px;row-gap:12px;
    grid-template-columns:var(--bsz) 340px;
    grid-template-rows:auto auto 1fr;
    grid-template-areas:"board head" "board coach" "board panel";
    padding:14px 0;
  }
  header{grid-area:head;padding-top:4px}
  .coach{grid-area:coach}
  .boardbox{grid-area:board;width:var(--bsz);height:var(--bsz)}
  .panel{grid-area:panel;min-height:0}
  .log{max-height:none;flex:1;min-height:120px}
}
@supports (height:100dvh){
  @media (min-width:700px) and (min-aspect-ratio:5/4){
    .wrap{--bsz:min(calc(100dvh - 36px - env(safe-area-inset-top) - env(safe-area-inset-bottom)), calc(100vw - 420px), 860px)}
  }
}
@media (prefers-reduced-motion:reduce){.pc{transition:none}.chk{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>小棋士<span>．</span>西洋棋</h1>
    <span class="lvtag" id="lvtag">初級</span>
  </header>

  <div class="coach" id="coach"><b id="coachIcon">王</b><p id="coachText">點「開新局」開始下棋。</p></div>

  <div class="boardbox" id="boardbox">
    <svg class="bg" id="bg" viewBox="0 0 1000 1000" aria-hidden="true"></svg>
    <div class="layer" id="layer" role="grid" aria-label="棋盤"></div>
  </div>

  <div class="panel">
    <div class="row">
      <button class="ui primary" id="btnNew">開新局</button>
      <button class="ui" id="btnUndo">悔棋</button>
      <button class="ui" id="btnHint">提示</button>

</div>

</div>

      <button class="ui" id="pickB"></button>

</div>

<div class="sheet" id="promoSheet">
  <div class="inner">
    <h2>兵升變</h2>
    <p class="sub">士兵走到底線了！要變成哪一種棋子？大多數時候選皇后最強。</p>
    <div class="picks" id="promoPicks"></div>
    <button class="ui close" id="promoCancel">不走這步</button>
  </div>
</div>

<script id="engine">
/* ============ 西洋棋引擎 ============ */
/* 0x88 棋盤：sq = row*16 + col，row 0 是第 8 橫列（黑方底線），白方往上走 */
const PAWN=1,KNIGHT=2,BISHOP=3,ROOK=4,QUEEN=5,KING=6;
const VAL=[0,100,320,330,500,900,0];
const ORDV=[0,100,320,330,500,900,2000];
const MATE=50000, INF=1e9, MAXPLY=64, STACK=4096;
const FILES='abcdefgh', LETTER=' PNBRQK';

const B=new Uint8Array(128);
let stm=0, castle=0, ep=-1, half=0, fullmove=1, sp=0;
const kingSq=[0,0];

const colorOf=p=>p>>3;
const typeOf=p=>p&7;
const sqName=s=>FILES[s&7]+(8-(s>>4));
const mvFrom=m=>m&127, mvTo=m=>(m>>7)&127, mvPromo=m=>(m>>14)&7, mvFlag=m=>(m>>17)&3;
const encode=(f,t,pr,fl)=>f|(t<<7)|(pr<<14)|(fl<<17);   // fl: 1 吃過路兵, 2 王車易位, 3 兵走兩格

const KN=[-33,-31,-18,-14,14,18,31,33];
const KG=[-17,-16,-15,-1,1,15,16,17];
const DG=[-17,-15,15,17];
const OR=[-16,-1,1,16];

/* 易位權：1 白短、2 白長、4 黑短、8 黑長 */
const CMASK=new Uint8Array(128).fill(15);
CMASK[116]=12; CMASK[119]=14; CMASK[112]=13; CMASK[4]=3; CMASK[7]=11; CMASK[0]=7;

/* ---- Zobrist ---- */
const zp1=new Int32Array(16*128), zp2=new Int32Array(16*128);
const zc1=new Int32Array(16), zc2=new Int32Array(16);
const ze1=new Int32Array(8), ze2=new Int32Array(8);
let zs1=0, zs2=0, h1=0, h2=0;
(function(){
  let s=88172645;
  const rnd=()=>{ s^=s<<13; s|=0; s^=s>>>17; s^=s<<5; s|=0; return s; };
  for(let i=0;i<16*128;i++){ zp1[i]=rnd(); zp2[i]=rnd(); }
  for(let i=0;i<16;i++){ zc1[i]=rnd(); zc2[i]=rnd(); }
  for(let i=0;i<8;i++){ ze1[i]=rnd(); ze2[i]=rnd(); }
  zs1=rnd(); zs2=rnd();
})();
function computeHash(){
  h1=0;h2=0;
  for(let i=0;i<128;i++){ const p=B[i]; if(p&&!(i&0x88)){ h1^=zp1[p*128+i]; h2^=zp2[p*128+i]; } }
  h1^=zc1[castle]; h2^=zc2[castle];
  if(ep>=0){ h1^=ze1[ep&7]; h2^=ze2[ep&7]; }
  if(stm){ h1^=zs1; h2^=zs2; }
}

/* ---- 局面設定 ---- */
function loadFEN(fen){
  const f=fen.trim().split(/\s+/);
  B.fill(0);
  let r=0,c=0;
  for(const ch of f[0]){
    if(ch==='/'){ r++; c=0; continue; }
    if(ch>='1'&&ch<='8'){ c+=+ch; continue; }
    const t=' pnbrqk'.indexOf(ch.toLowerCase());
    const col= ch===ch.toLowerCase()? 1:0;
    B[r*16+c]=t|(col<<3);
    if(t===KING) kingSq[col]=r*16+c;
    c++;
  }
  stm= f[1]==='b'?1:0;
  castle=0;
  if(f[2]&&f[2]!=='-'){
    if(f[2].includes('K')) castle|=1; if(f[2].includes('Q')) castle|=2;
    if(f[2].includes('k')) castle|=4; if(f[2].includes('q')) castle|=8;
  }
  ep=-1;
  if(f[3]&&f[3]!=='-') ep=(8-(+f[3][1]))*16+FILES.indexOf(f[3][0]);
  half=f[4]?+f[4]:0; fullmove=f[5]?+f[5]:1; sp=0;
  computeHash();
}
const START_FEN='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
function setupInitial(){ loadFEN(START_FEN); }
function toFEN(){
  let s='';
  for(let r=0;r<8;r++){
    let e=0;
    for(let c=0;c<8;c++){
      const p=B[r*16+c];
      if(!p){ e++; continue; }
      if(e){ s+=e; e=0; }
      const ch=' pnbrqk'[p&7]; s+= (p>>3)? ch : ch.toUpperCase();
    }
    if(e) s+=e; if(r<7) s+='/';
  }
  let cs=(castle&1?'K':'')+(castle&2?'Q':'')+(castle&4?'k':'')+(castle&8?'q':'');
  return s+' '+(stm?'b':'w')+' '+(cs||'-')+' '+(ep>=0?sqName(ep):'-')+' '+half+' '+fullmove;
}

/* ---- 攻擊判斷 ---- */
function attacked(sq,by){
  const c=by<<3;
  if(by===0){
    if(!((sq+15)&0x88)&&B[sq+15]===PAWN) return true;
    if(!((sq+17)&0x88)&&B[sq+17]===PAWN) return true;
  }else{
    if(!((sq-15)&0x88)&&B[sq-15]===(PAWN|8)) return true;
    if(!((sq-17)&0x88)&&B[sq-17]===(PAWN|8)) return true;
  }
  for(let k=0;k<8;k++){ const t=sq+KN[k]; if(!(t&0x88)&&B[t]===(KNIGHT|c)) return true; }
  for(let k=0;k<8;k++){ const t=sq+KG[k]; if(!(t&0x88)&&B[t]===(KING|c)) return true; }
  for(let k=0;k<4;k++){
    const d=DG[k]; let t=sq+d;
    while(!(t&0x88)){ const q=B[t]; if(q){ if(q===(BISHOP|c)||q===(QUEEN|c)) return true; break; } t+=d; }
  }
  for(let k=0;k<4;k++){
    const d=OR[k]; let t=sq+d;
    while(!(t&0x88)){ const q=B[t]; if(q){ if(q===(ROOK|c)||q===(QUEEN|c)) return true; break; } t+=d; }
  }
  return false;
}
function inCheck(s){ return attacked(kingSq[s],s^1); }

/* ---- 走法產生（偽合法）---- */
const MVBUF=new Int32Array((MAXPLY+2)*256);
const MSBUF=new Int32Array((MAXPLY+2)*256);

function gen(base,capsOnly){
  let n=0; const us=stm, them=us^1;
  for(let sq=0;sq<120;sq++){
    if(sq&0x88){ sq+=7; continue; }
    const p=B[sq]; if(!p||(p>>3)!==us) continue;
    const t=p&7;
    if(t===PAWN){
      const fw= us===0? -16:16, startRow= us===0? 6:1, promRow= us===0? 0:7;
      const to=sq+fw;
      if(!(to&0x88)&&!B[to]){
        if((to>>4)===promRow){
          MVBUF[base+n++]=encode(sq,to,QUEEN,0);
          if(!capsOnly){ MVBUF[base+n++]=encode(sq,to,KNIGHT,0);
            MVBUF[base+n++]=encode(sq,to,ROOK,0); MVBUF[base+n++]=encode(sq,to,BISHOP,0); }
        }else if(!capsOnly){
          MVBUF[base+n++]=encode(sq,to,0,0);
          if((sq>>4)===startRow&&!B[to+fw]) MVBUF[base+n++]=encode(sq,to+fw,0,3);
        }
      }
      for(let k=0;k<2;k++){
        const t2=to+(k?1:-1); if(t2&0x88) continue;
        const q=B[t2];
        if(q&&(q>>3)===them){
          if((t2>>4)===promRow){
            MVBUF[base+n++]=encode(sq,t2,QUEEN,0);
            if(!capsOnly){ MVBUF[base+n++]=encode(sq,t2,KNIGHT,0);
              MVBUF[base+n++]=encode(sq,t2,ROOK,0); MVBUF[base+n++]=encode(sq,t2,BISHOP,0); }
          }else MVBUF[base+n++]=encode(sq,t2,0,0);
        }else if(t2===ep) MVBUF[base+n++]=encode(sq,t2,0,1);
      }
    }
    else if(t===KNIGHT||t===KING){
      const D= t===KNIGHT? KN:KG;
      for(let k=0;k<8;k++){
        const to=sq+D[k]; if(to&0x88) continue;
        const q=B[to];
        if(q){ if((q>>3)===them) MVBUF[base+n++]=encode(sq,to,0,0); }
        else if(!capsOnly) MVBUF[base+n++]=encode(sq,to,0,0);
      }
      if(t===KING&&!capsOnly){
        if(us===0&&sq===116){
          if((castle&1)&&!B[117]&&!B[118]&&B[119]===ROOK&&!attacked(116,1)&&!attacked(117,1))
            MVBUF[base+n++]=encode(116,118,0,2);
          if((castle&2)&&!B[115]&&!B[114]&&!B[113]&&B[112]===ROOK&&!attacked(116,1)&&!attacked(115,1))
            MVBUF[base+n++]=encode(116,114,0,2);
        }else if(us===1&&sq===4){
          if((castle&4)&&!B[5]&&!B[6]&&B[7]===(ROOK|8)&&!attacked(4,0)&&!attacked(5,0))
            MVBUF[base+n++]=encode(4,6,0,2);
          if((castle&8)&&!B[3]&&!B[2]&&!B[1]&&B[0]===(ROOK|8)&&!attacked(4,0)&&!attacked(3,0))
            MVBUF[base+n++]=encode(4,2,0,2);
        }
      }
    }
    else{
      const D= t===BISHOP? DG : t===ROOK? OR : KG;
      const nd= t===QUEEN? 8:4;
      for(let k=0;k<nd;k++){
        const d=D[k]; let to=sq+d;
        while(!(to&0x88)){
          const q=B[to];
          if(q){ if((q>>3)===them) MVBUF[base+n++]=encode(sq,to,0,0); break; }
          if(!capsOnly) MVBUF[base+n++]=encode(sq,to,0,0);
          to+=d;
        }
      }
    }
  }
  return n;
}

/* ---- 走子／還原 ---- */
const uMv=new Int32Array(STACK), uCap=new Uint8Array(STACK), uCastle=new Uint8Array(STACK);
const uEp=new Int16Array(STACK), uHalf=new Int16Array(STACK);
const uH1=new Int32Array(STACK), uH2=new Int32Array(STACK);

function make(mv){
  const from=mv&127, to=(mv>>7)&127, pr=(mv>>14)&7, fl=(mv>>17)&3;
  const p=B[from], us=p>>3;
  let capSq=to;
  if(fl===1) capSq= to+(us===0?16:-16);
  const cap=B[capSq];
  uMv[sp]=mv; uCap[sp]=cap; uCastle[sp]=castle; uEp[sp]=ep; uHalf[sp]=half; uH1[sp]=h1; uH2[sp]=h2; sp++;
  if(ep>=0){ h1^=ze1[ep&7]; h2^=ze2[ep&7]; }
  h1^=zc1[castle]; h2^=zc2[castle];
  if(cap){ B[capSq]=0; h1^=zp1[cap*128+capSq]; h2^=zp2[cap*128+capSq]; }
  B[from]=0; h1^=zp1[p*128+from]; h2^=zp2[p*128+from];
  const np= pr? (pr|(us<<3)) : p;
  B[to]=np; h1^=zp1[np*128+to]; h2^=zp2[np*128+to];
  if((p&7)===KING){
    kingSq[us]=to;
    if(fl===2){
      const rf= to>from? from+3 : from-4, rt= to>from? from+1 : from-1, r=B[rf];
      B[rf]=0; B[rt]=r;
      h1^=zp1[r*128+rf]^zp1[r*128+rt]; h2^=zp2[r*128+rf]^zp2[r*128+rt];
    }
  }
  castle&=CMASK[from]&CMASK[to];
  h1^=zc1[castle]; h2^=zc2[castle];
  ep=-1;
  if(fl===3){
    const ep2=PAWN|((us^1)<<3);
    // 只有旁邊真的有對方的兵時才記錄過路兵格，讓重複局面判斷更準確
    if((!((to-1)&0x88)&&B[to-1]===ep2)||(!((to+1)&0x88)&&B[to+1]===ep2)){
      ep=(from+to)>>1; h1^=ze1[ep&7]; h2^=ze2[ep&7];
    }
  }
  half= (cap||(p&7)===PAWN)? 0 : half+1;
  if(us===1) fullmove++;
  stm^=1; h1^=zs1; h2^=zs2;
  return cap;
}
function unmake(){
  sp--;
  const mv=uMv[sp], from=mv&127, to=(mv>>7)&127, pr=(mv>>14)&7, fl=(mv>>17)&3;
  stm^=1; const us=stm;
  const p= pr? (PAWN|(us<<3)) : B[to];
  B[from]=p; B[to]=0;
  if(fl===1) B[to+(us===0?16:-16)]=uCap[sp]; else B[to]=uCap[sp];
  if((p&7)===KING){
    kingSq[us]=from;
    if(fl===2){
      const rf= to>from? from+3 : from-4, rt= to>from? from+1 : from-1;
      B[rf]=B[rt]; B[rt]=0;
    }
  }
  castle=uCastle[sp]; ep=uEp[sp]; half=uHalf[sp]; h1=uH1[sp]; h2=uH2[sp];
  if(us===1) fullmove--;
}
function makeNull(){
  uMv[sp]=0; uCap[sp]=0; uCastle[sp]=castle; uEp[sp]=ep; uHalf[sp]=half; uH1[sp]=h1; uH2[sp]=h2; sp++;
  if(ep>=0){ h1^=ze1[ep&7]; h2^=ze2[ep&7]; ep=-1; }
  half=0; stm^=1; h1^=zs1; h2^=zs2;
}
function unmakeNull(){
  sp--; stm^=1; castle=uCastle[sp]; ep=uEp[sp]; half=uHalf[sp]; h1=uH1[sp]; h2=uH2[sp];
}

function legalMoves(){
  const base=(MAXPLY+1)*256, n=gen(base,false), buf=[], res=[];
  for(let i=0;i<n;i++) buf.push(MVBUF[base+i]);
  const us=stm;
  for(const mv of buf){ make(mv); if(!attacked(kingSq[us],us^1)) res.push(mv); unmake(); }
  return res;
}

function perft(d,ply){
  ply=ply||0;
  if(d===0) return 1;
  const base=ply*256, n=gen(base,false), us=stm;
  let c=0;
  for(let i=0;i<n;i++){
    make(MVBUF[base+i]);
    if(!attacked(kingSq[us],us^1)) c+= d===1? 1 : perft(d-1,ply+1);
    unmake();
  }
  return c;
}

/* ---- 和棋判斷 ---- */
function isRepetition(){          // 搜尋用：局面曾出現過一次就當作和棋
  for(let i=sp-4;i>=0&&i>=sp-half;i-=2) if(uH1[i]===h1&&uH2[i]===h2) return true;
  return false;
}
function posKey(){                // 重複局面用：只有真的能吃過路兵時才算入過路兵格
  let a=h1,b=h2;
  if(ep>=0 && !legalMoves().some(m=>mvFlag(m)===1)){ a^=ze1[ep&7]; b^=ze2[ep&7]; }
  return a+':'+b;
}
function insufficientMaterial(){
  let minors=0, bishopsColor=-1, mixed=false, knights=0;
  for(let sq=0;sq<120;sq++){
    if(sq&0x88){ sq+=7; continue; }
    const t=B[sq]&7;
    if(!t||t===KING) continue;
    if(t===PAWN||t===ROOK||t===QUEEN) return false;
    minors++;
    if(t===KNIGHT) knights++;
    else{ const c=((sq>>4)+(sq&7))&1; if(bishopsColor<0) bishopsColor=c; else if(bishopsColor!==c) mixed=true; }
  }
  if(minors<=1) return true;                       // 王對王、王對王＋單騎士或單主教
  return knights===0 && !mixed;                    // 雙方只剩同色格的主教
}

const PST=[[],

[-20,-10,-10, -5, -5,-10,-10,-20,

 -10,-20,-20,-20,-20,-20,-20,-10,
  20, 20,  0,  0,  0,  0, 20, 20,
  20, 30, 10,  0,  0, 10, 30, 20]];
const KING_END=
[-50,-40,-30,-20,-20,-30,-40,-50,
 -30,-20,-10,  0,  0,-10,-20,-30,
 -30,-10, 20, 30, 30, 20,-10,-30,
 -30,-10, 30, 40, 40, 30,-10,-30,
 -30,-10, 30, 40, 40, 30,-10,-30,
 -30,-10, 20, 30, 30, 20,-10,-30,
 -30,-30,  0,  0,  0,  0,-30,-30,
 -50,-30,-30,-30,-30,-30,-30,-50];
const PASSED=[0,120,80,50,30,15,10,0];      // 依離升變還有幾列
const PHASE=[0,0,1,1,2,4,0];
const wMax=new Int8Array(8), bMin=new Int8Array(8);

function evaluate(){
  let mg=0, eg=0, phase=0;
  const npm=[0,0], pawns=[0,0], bish=[0,0];
  wMax.fill(-1); bMin.fill(8);
  for(let sq=0;sq<120;sq++){
    if(sq&0x88){ sq+=7; continue; }
    const p=B[sq]; if(!p) continue;
    const t=p&7, c=p>>3, r=sq>>4, f=sq&7;
    const idx= c===0? r*8+f : (7-r)*8+f;
    phase+=PHASE[t];
    if(t===PAWN){ pawns[c]++; if(c===0){ if(r>wMax[f]) wMax[f]=r; } else if(r<bMin[f]) bMin[f]=r; }
    else if(t!==KING) npm[c]+=VAL[t];
    if(t===BISHOP) bish[c]++;
    let v=VAL[t], m=0, e=0;
    if(t===KING){ m=PST[KING][idx]; e=KING_END[idx]; }
    else { m=e=PST[t][idx]; }
    if(c===0){ mg+=v+m; eg+=v+e; } else { mg-=v+m; eg-=v+e; }
  }
  // 通路兵
  for(let sq=0;sq<120;sq++){
    if(sq&0x88){ sq+=7; continue; }
    const p=B[sq]; if((p&7)!==PAWN) continue;
    const r=sq>>4, f=sq&7;
    if(p===PAWN){
      let passed=true;
      for(let ff=f-1;ff<=f+1&&passed;ff++) if(ff>=0&&ff<8&&bMin[ff]<r) passed=false;
      if(passed){ mg+=PASSED[r]>>1; eg+=PASSED[r]; }
    }else{
      let passed=true;
      for(let ff=f-1;ff<=f+1&&passed;ff++) if(ff>=0&&ff<8&&wMax[ff]>r) passed=false;
      if(passed){ mg-=PASSED[7-r]>>1; eg-=PASSED[7-r]; }
    }
  }
  if(bish[0]>=2){ mg+=30; eg+=40; }
  if(bish[1]>=2){ mg-=30; eg-=40; }
  if(phase>24) phase=24;
  let s=((mg*phase)+(eg*(24-phase)))/24|0;
  // 殘局收網：優勢方把對方國王逼到邊角
  if(pawns[0]+pawns[1]===0 || phase<=6){
    const diff=npm[0]-npm[1];
    if(Math.abs(diff)>=300){
      const win= diff>0? 0:1, lk=kingSq[win^1], wk=kingSq[win];
      const lr=lk>>4, lf=lk&7;
      const cd=Math.max(3-lr,lr-4)+Math.max(3-lf,lf-4);
      const kd=Math.abs((wk>>4)-lr)+Math.abs((wk&7)-lf);
      const bonus=cd*12+(14-kd)*5;
      s+= win===0? bonus : -bonus;
    }
  }
  // 沒兵又只剩一個輕子的一方贏不了
  if(s>0&&pawns[0]===0&&npm[0]<=330) s=0;
  if(s<0&&pawns[1]===0&&npm[1]<=330) s=0;
  return stm===0? s : -s;
}

/* ---- 置換表與啟發式 ---- */
const TT_BITS=19, TT_SIZE=1<<TT_BITS, TT_MASK=TT_SIZE-1;
let ttLock=null, ttMv, ttSc, ttDp, ttFl;
function ttInit(){
  if(ttLock) return;
  ttLock=new Int32Array(TT_SIZE); ttMv=new Int32Array(TT_SIZE); ttSc=new Int32Array(TT_SIZE);
  ttDp=new Int8Array(TT_SIZE); ttFl=new Uint8Array(TT_SIZE);
}
const killer=new Int32Array(MAXPLY*2);
const hist=new Int32Array(128*128);

let deadline=0, aborted=false, nodes=0;
function now(){ return (typeof performance!=='undefined')? performance.now() : Date.now(); }

function scoreMoves(base,n,ttm,ply){
  const k1=killer[ply*2], k2=killer[ply*2+1];
  for(let i=0;i<n;i++){
    const mv=MVBUF[base+i], to=(mv>>7)&127, pr=(mv>>14)&7, fl=(mv>>17)&3;
    const cap= fl===1? PAWN : (B[to]&7);
    let s;
    if(mv===ttm) s=1<<28;
    else if(cap||pr) s=(1<<22)+ORDV[cap]*16+ORDV[pr]*8-ORDV[B[mv&127]&7];
    else if(mv===k1) s=1<<20;
    else if(mv===k2) s=(1<<20)-1;
    else s=hist[(mv&127)*128+to];
    MSBUF[base+i]=s;
  }
}
function pickBest(base,n,i){
  let bi=i, bs=MSBUF[base+i];
  for(let j=i+1;j<n;j++) if(MSBUF[base+j]>bs){ bs=MSBUF[base+j]; bi=j; }
  if(bi!==i){
    let t=MVBUF[base+i]; MVBUF[base+i]=MVBUF[base+bi]; MVBUF[base+bi]=t;
    t=MSBUF[base+i]; MSBUF[base+i]=MSBUF[base+bi]; MSBUF[base+bi]=t;
  }
}
function hasPieces(s){
  for(let sq=0;sq<120;sq++){
    if(sq&0x88){ sq+=7; continue; }
    const p=B[sq]; if(p&&(p>>3)===s){ const t=p&7; if(t!==PAWN&&t!==KING) return true; }
  }
  return false;
}

function qsearch(alpha,beta,ply){
  if(((++nodes)&1023)===0 && now()>deadline) aborted=true;
  if(aborted||ply>=MAXPLY) return evaluate();
  const us=stm, chk=attacked(kingSq[us],us^1);
  let best=-INF;
  if(!chk){
    best=evaluate();
    if(best>=beta) return best;
    if(best>alpha) alpha=best;
  }
  const base=ply*256, n=gen(base,!chk);
  scoreMoves(base,n,0,ply);
  let legal=0;
  for(let i=0;i<n;i++){
    pickBest(base,n,i);
    const mv=MVBUF[base+i];
    make(mv);
    if(attacked(kingSq[us],us^1)){ unmake(); continue; }
    legal++;
    const s=-qsearch(-beta,-alpha,ply+1);
    unmake();
    if(aborted) return 0;
    if(s>best){ best=s; if(s>alpha){ alpha=s; if(s>=beta) return s; } }
  }
  if(chk&&legal===0) return -MATE+ply;
  return best;
}

function negamax(depth,alpha,beta,ply,canNull){
  if(((++nodes)&1023)===0 && now()>deadline) aborted=true;
  if(aborted) return 0;
  if(ply>0 && (half>=100 || isRepetition())) return 0;
  if(ply>=MAXPLY) return evaluate();

  const us=stm, chk=attacked(kingSq[us],us^1);
  if(chk) depth++;                                   // 將軍延伸
  if(depth<=0) return qsearch(alpha,beta,ply);

  const idx=h1&TT_MASK;
  let ttm=0;
  if(ttLock[idx]===h2){
    ttm=ttMv[idx];
    if(ttDp[idx]>=depth){
      let s=ttSc[idx];
      if(s>MATE-1000) s-=ply; else if(s<-MATE+1000) s+=ply;
      const f=ttFl[idx];
      if(f===1) return s;
      if(f===2 && s>=beta) return s;
      if(f===3 && s<=alpha) return s;
    }
  }

  if(canNull && !chk && depth>=3 && Math.abs(beta)<MATE-1000 && hasPieces(us) && evaluate()>=beta){
    makeNull();
    const s=-negamax(depth-3,-beta,-beta+1,ply+1,false);
    unmakeNull();
    if(aborted) return 0;
    if(s>=beta) return beta;
  }

  const base=ply*256, n=gen(base,false);
  scoreMoves(base,n,ttm,ply);
  let best=-INF, bestMove=0, legal=0, flag=3;
  for(let i=0;i<n;i++){
    pickBest(base,n,i);
    const mv=MVBUF[base+i];
    const quiet= !B[(mv>>7)&127] && !((mv>>14)&7) && ((mv>>17)&3)!==1;
    make(mv);
    if(attacked(kingSq[us],us^1)){ unmake(); continue; }
    legal++;
    let s;
    if(legal===1) s=-negamax(depth-1,-beta,-alpha,ply+1,true);
    else{
      // 後面的安靜走法先減一層試探（LMR），有希望再完整搜尋
      let r= (quiet && legal>4 && depth>=3 && !chk && !attacked(kingSq[stm],us))? 1 : 0;
      s=-negamax(depth-1-r,-alpha-1,-alpha,ply+1,true);
      if(!aborted && r && s>alpha) s=-negamax(depth-1,-alpha-1,-alpha,ply+1,true);
      if(!aborted && s>alpha && s<beta) s=-negamax(depth-1,-beta,-alpha,ply+1,true);
    }
    unmake();
    if(aborted) return 0;
    if(s>best){
      best=s; bestMove=mv;
      if(s>alpha){
        alpha=s; flag=1;
        if(s>=beta){
          flag=2;
          if(quiet){
            if(killer[ply*2]!==mv){ killer[ply*2+1]=killer[ply*2]; killer[ply*2]=mv; }
            const hi=(mv&127)*128+((mv>>7)&127);
            hist[hi]+=depth*depth;
            if(hist[hi]>(1<<19)) for(let z=0;z<hist.length;z++) hist[z]>>=1;
          }
          break;
        }
      }
    }
  }
  if(legal===0) return chk? -MATE+ply : 0;          // 將死輸、逼和算和

  let st=best;
  if(st>MATE-1000) st+=ply; else if(st<-MATE+1000) st-=ply;
  ttLock[idx]=h2; ttMv[idx]=bestMove; ttSc[idx]=st; ttDp[idx]=depth; ttFl[idx]=flag;
  return best;
}

/* slack>0 時，所有與最佳差距在 slack 之內的走法都會得到精確分數，方便低難度隨機挑選 */
function searchBest(maxDepth,timeMs,slack){
  ttInit();
  slack=slack||0;
  deadline=now()+timeMs; aborted=false; nodes=0;
  killer.fill(0);
  const roots=legalMoves();
  if(!roots.length) return null;
  let best=roots[0], bestScore=0, list=null, reached=0;
  for(let d=1;d<=maxDepth;d++){
    let curScore=-INF, cur=best;
    const acc=[], ordered=[best].concat(roots.filter(m=>m!==best));
    for(const mv of ordered){
      const floor= curScore===-INF? -INF : curScore-slack-1;
      make(mv);
      let s;
      if(floor===-INF) s=-negamax(d-1,-INF,INF,1,true);
      else{
        s=-negamax(d-1,-floor-1,-floor,1,true);
        if(!aborted && s>floor) s=-negamax(d-1,-INF,-floor,1,true);
      }
      unmake();
      if(aborted) break;
      acc.push([mv,s]);
      if(s>curScore){ curScore=s; cur=mv; }
    }
    if(aborted) break;
    best=cur; bestScore=curScore; list=acc; reached=d;
    if(bestScore>MATE-500) break;
    if(now()>deadline) break;
  }
  return {mv:best, score:bestScore, list:list||[[best,0]], depth:reached, nodes};
}

/* ---- 標準代數記譜（SAN）---- */
function moveToSAN(mv,legal){
  legal=legal||legalMoves();
  const from=mv&127, to=(mv>>7)&127, pr=(mv>>14)&7, fl=(mv>>17)&3, p=B[from], t=p&7;
  let s;
  if(fl===2) s= to>from? 'O-O' : 'O-O-O';
  else{
    const cap= !!B[to] || fl===1;
    if(t===PAWN){
      s=(cap? FILES[from&7]+'x' : '')+sqName(to);
      if(pr) s+='='+LETTER[pr];
    }else{
      s=LETTER[t];
      const others=legal.filter(m=>m!==mv && ((m>>7)&127)===to && B[m&127]===p);
      if(others.length){
        const sameFile=others.some(m=>((m&127)&7)===(from&7));
        const sameRank=others.some(m=>((m&127)>>4)===(from>>4));
        if(!sameFile) s+=FILES[from&7];
        else if(!sameRank) s+=(8-(from>>4));
        else s+=sqName(from);
      }
      s+=(cap?'x':'')+sqName(to);
    }
  }
  make(mv);
  if(inCheck(stm)) s+= legalMoves().length? '+' : '#';
  unmake();
  return s;
}
function sanToMove(san){
  const clean=x=>x.replace(/[+#?!]/g,'').replace(/0/g,'O');
  const want=clean(san), legal=legalMoves();
  for(const m of legal) if(clean(moveToSAN(m,legal))===want) return m;
  return 0;
}

function setGame(list){ setupInitial(); for(const m of list) make(m); }

if(typeof module!=='undefined') module.exports={
  B,kingSq,setupInitial,loadFEN,toFEN,setGame,legalMoves,make,unmake,perft,searchBest,
  moveToSAN,sanToMove,inCheck,evaluate,posKey,insufficientMaterial,sqName,
  mvFrom,mvTo,mvPromo,mvFlag,MATE,PAWN,KNIGHT,BISHOP,ROOK,QUEEN,KING,
  state:()=>({stm,castle,ep,half,fullmove,sp})};
</script>

<script id="ui">
/* ============ 畫面與互動 ============ */
const $=id=>document.getElementById(id);
const LEVELS=[
  {name:'新手', depth:1,  time:150,  slack:250, blunder:.35},
  {name:'初級', depth:2,  time:300,  slack:100, blunder:.12},
  {name:'中級', depth:4,  time:900,  slack:25,  blunder:0},
  {name:'高級', depth:7,  time:3000, slack:0,   blunder:0},
  {name:'大師', depth:30, time:7000, slack:0,   blunder:0}
];
let level=1, sound=true;
const TWO=LEVELS.length;              // level===TWO 代表雙人對戰
const twoP=()=>level===TWO;
const sideName=t=>t===0?'白方':'黑方';
const NAME=['','士兵','騎士','主教','城堡','皇后','國王'];
const ICON=['','兵','馬','象','車','后','王'];

/* ---- 背景執行緒（讓高難度思考時畫面不卡住）---- */
const pending={}; let reqId=0, worker=null, workerOK=false;
(function(){
  try{
    const src=document.getElementById('engine').textContent+
      "\nself.onmessage=function(ev){var d=ev.data;setGame(d.moves);"+
      "self.postMessage({id:d.id,r:searchBest(d.depth,d.time,d.slack)});};";
    worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    worker.onmessage=e=>{ const cb=pending[e.data.id];
      if(cb){ delete pending[e.data.id]; cb(e.data.r); } };
    worker.onerror=()=>{ workerOK=false; };
    workerOK=true;
  }catch(e){ workerOK=false; }
})();
function think(depth,time,slack,cb){
  const list=record.map(h=>h.mv);
  if(workerOK){
    const id=++reqId; pending[id]=cb;
    worker.postMessage({id,moves:list,depth,time,slack});
  }else{
    setTimeout(()=>{
      const r=searchBest(depth,time,slack);
      setGame(list);                    // 搜尋後把盤面還原成目前的對局
      cb(r);
    },30);
  }
}

let human=0;                 // 0 執白、1 執黑
let sel=-1, moves=[], record=[], keys=[], busy=false, over=false, gameId=0;
let lastMove=null, hintMove=null, animMove=null, promoChoices=null;

const flipped=()=>!twoP() && human===1;

/* ---- 棋子（內嵌 SVG）---- */
const SHAPES={
  1:'<circle cx="50" cy="30" r="13"/><path d="M38 46 H62 L57 52 C58 64 64 72 70 82 H30 C36 72 42 64 43 52 Z"/>',
  2:'<path d="M34 82 C32 70 36 60 44 52 C38 54 31 57 26 55 C21 52 22 45 27 41 L42 28 C44 22 47 18 51 16 L53 10 L58 17 C70 21 77 36 76 54 C75 66 72 74 70 82 Z"/><path class="d" d="M58 21 C66 31 69 45 66 62" fill="none"/><circle class="e" cx="46" cy="29" r="2.8"/>',
  3:'<circle cx="50" cy="12" r="5"/><path d="M50 17 C63 28 67 40 60 52 H40 C33 40 37 28 50 17 Z"/><path class="d" d="M55 27 L47 40" fill="none"/><path d="M38 52 H62 V59 H38 Z"/><path d="M41 59 H59 C60 68 64 76 68 82 H32 C36 76 40 68 41 59 Z"/>',
  4:'<path d="M28 18 H38 V26 H45 V18 H55 V26 H62 V18 H72 V36 L64 42 V70 L70 82 H30 L36 70 V42 L28 36 Z"/><path class="d" d="M36 42 H64 M36 70 H64" fill="none"/>',
  5:'<path d="M22 32 L34 58 L37 28 L45 54 L50 24 L55 54 L63 28 L66 58 L78 32 L69 70 H31 Z"/><circle cx="22" cy="30" r="4.5"/><circle cx="37" cy="26" r="4.5"/><circle cx="50" cy="20" r="4.5"/><circle cx="63" cy="26" r="4.5"/><circle cx="78" cy="30" r="4.5"/><path d="M31 70 H69 L72 82 H28 Z"/>',
  6:'<path d="M47 5 H53 V11 H59 V17 H53 V27 H47 V17 H41 V11 H47 Z"/><path d="M50 30 C60 23 77 27 76 42 C76 54 68 60 66 70 H34 C32 60 24 54 24 42 C23 27 40 23 50 30 Z"/><path class="d" d="M50 31 V60" fill="none"/><path d="M34 70 H66 L70 82 H30 Z"/>'
};
const BASE='<path d="M26 82 H74 A4 4 0 0 1 78 86 V91 H22 V86 A4 4 0 0 1 26 82 Z"/>';
function pieceSVG(p){
  const white=(p>>3)===0;
  const fill= white? '#F8F0DE' : '#2A2622', stroke= white? '#3A2E20' : '#0E0B09';
  const detail= white? '#3A2E20' : '#E9DFC9';
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="${fill}" stroke="${stroke}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">`+
    `<style>.d{stroke:${detail};stroke-width:2.6}.e{fill:${detail};stroke:none}</style>`+
    SHAPES[p&7]+BASE+'</g></svg>';
}

/* ---- 畫棋盤 ---- */
function drawBoard(){
  const f=flipped();
  let sq='', lab='';
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const dark=(r+c)&1;
    sq+=`<rect x="${30+c*117.5}" y="${30+r*117.5}" width="117.6" height="117.6" fill="${dark?'#B48A57':'#EDDAB2'}"/>`;
  }
  for(let i=0;i<8;i++){
    const file=FILES[f? 7-i : i], rank= f? i+1 : 8-i;
    const fileDark= (7+i)&1, rankDark= i&1;          // 標籤用對比色
    lab+=`<text x="${30+i*117.5+108}" y="${30+8*117.5-8}" text-anchor="end" fill="${fileDark?'#EDDAB2':'#8F6A3C'}">${file}</text>`;
    lab+=`<text x="${38}" y="${30+i*117.5+26}" fill="${rankDark?'#EDDAB2':'#8F6A3C'}">${rank}</text>`;
  }
  $('bg').innerHTML=
    `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
       <stop offset="0" stop-color="#5A4128"/><stop offset="1" stop-color="#3A2A1A"/></linearGradient>
       <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
       <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#000" stop-opacity=".10"/></linearGradient></defs>
     <rect width="1000" height="1000" fill="url(#g)"/>
     ${sq}
     <rect x="30" y="30" width="940" height="940" fill="url(#sh)"/>
     <rect x="27" y="27" width="946" height="946" fill="none" stroke="#C8A64A" stroke-width="3" opacity=".7"/>
     <g font-family="system-ui,sans-serif" font-size="22" font-weight="700">${lab}</g>`;
}

/* ---- 幾何 ---- */
function viewRC(sq){ let r=sq>>4, c=sq&7; if(flipped()){ r=7-r; c=7-c; } return [r,c]; }
const posL=sq=>((viewRC(sq)[1]+.5)*12.5)+'%';
const posT=sq=>((viewRC(sq)[0]+.5)*12.5)+'%';
function place(el,sq){ el.style.left=posL(sq); el.style.top=posT(sq); }

/* ---- 音效 ---- */
let ac=null;
function beep(freq,dur){
  if(!sound) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();   // iOS/iPadOS 需在點擊時解鎖音訊
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='triangle'; o.frequency.value=freq;
    g.gain.setValueAtTime(.14,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}

/* ---- 渲染 ---- */
function addSq(cls,sq){
  const d=document.createElement('div'); d.className=cls; place(d,sq); $('layer').appendChild(d); return d;
}
function render(){
  const layer=$('layer'); layer.innerHTML='';
  if(lastMove!==null){ addSq('sq mark',mvFrom(lastMove)); addSq('sq mark',mvTo(lastMove)); }
  if(hintMove!==null){ addSq('sq hint',mvFrom(hintMove)); addSq('sq hint',mvTo(hintMove)); }
  if(sel>=0) addSq('sq selsq',sel);
  if(inCheck(stm)) addSq('sq chk',kingSq[stm]);
  const anims=[];
  for(let sq=0;sq<120;sq++){
    if(sq&0x88){ sq+=7; continue; }
    const p=B[sq]; if(!p) continue;
    const d=document.createElement('div');
    d.className='pc'+(sq===sel?' sel':'')+(twoP()&&(p>>3)===1?' flip':'');
    d.innerHTML=pieceSVG(p);
    d.setAttribute('role','img');
    d.setAttribute('aria-label',((p>>3)?'黑':'白')+NAME[p&7]+' '+sqName(sq));
    if(animMove!==null){
      const f=mvFrom(animMove), t=mvTo(animMove);
      if(sq===t){ anims.push([d,f,t]); }
      if(mvFlag(animMove)===2 && (p&7)===ROOK){
        const rf= t>f? f+3 : f-4, rt= t>f? f+1 : f-1;
        if(sq===rt) anims.push([d,rf,rt]);
      }
    }
    place(d,sq);
    layer.appendChild(d);
  }
  // 讓剛走的棋子從原位滑過去
  for(const [d,f,t] of anims){
    d.style.transition='none'; place(d,f); d.classList.add('lift');
    d.getBoundingClientRect();
    d.style.transition=''; place(d,t);
  }
  animMove=null;
  const seen={};
  for(const mv of moves){
    const to=mvTo(mv); if(seen[to]) continue; seen[to]=1;
    const cap= B[to] || mvFlag(mv)===1;
    const d=document.createElement('div'); d.className=cap?'ring':'dot';
    place(d,to); layer.appendChild(d);
  }
}

function coach(text,mode,icon){
  $('coachText').textContent=text;
  $('coach').className='coach'+(mode?' '+mode:'');
  $('coachIcon').textContent=icon||'王';
}

function drawLog(){
  const el=$('log');
  if(!record.length){ el.innerHTML='<em>棋譜會顯示在這裡。</em>'; return; }
  let h='';
  for(let i=0;i<record.length;i+=2){
    const w=record[i], b=record[i+1];
    h+=`<div><i>${i/2+1}.</i><span class="ww">${w.san}</span>`+
       `<span class="bb">${b? b.san : ''}</span></div>`;
  }
  el.innerHTML=h; el.scrollTop=el.scrollHeight;
}

/* ---- 互動 ---- */
function squareFromPoint(e){
  const r=$('layer').getBoundingClientRect();
  let c=Math.floor((e.clientX-r.left)/r.width*8), row=Math.floor((e.clientY-r.top)/r.height*8);
  if(c<0||c>7||row<0||row>7) return -1;
  if(flipped()){ c=7-c; row=7-row; }
  return row*16+c;
}
$('layer').addEventListener('click',e=>{ const sq=squareFromPoint(e); if(sq>=0) tap(sq); });
$('boardbox').addEventListener('dblclick',e=>e.preventDefault());

function tap(sq){
  if(busy||over) return;
  if(!twoP() && stm!==human) return;
  const me=stm;
  hintMove=null;
  const targets=moves.filter(mv=>mvTo(mv)===sq && mvFrom(mv)===sel);
  if(targets.length===1){ doMove(targets[0]); return; }
  if(targets.length>1){ askPromotion(targets); return; }
  const p=B[sq];
  if(p&&(p>>3)===me){
    if(sel===sq){ sel=-1; moves=[]; render(); return; }
    sel=sq;
    moves=legalMoves().filter(mv=>mvFrom(mv)===sq);
    const t=p&7;
    let tip=TIPS[t].short;
    if(moves.some(m=>mvFlag(m)===2)) tip='可以「王車易位」喔！點國王旁邊隔一格的綠點，城堡會自動跳過來保護國王。';
    else if(moves.some(m=>mvFlag(m)===1)) tip='可以「吃過路兵」喔！對方的兵剛剛一次走兩格，從你的兵旁邊經過，可以斜著吃掉牠。';
    else if(moves.some(m=>mvPromo(m))) tip='再走一步就到底線了，可以升變成更厲害的棋子！';
    coach(tip, null, ICON[t]);
    if(!moves.length) coach('這個'+NAME[t]+'現在走不動，換一顆試試。',null,ICON[t]);
    beep(520,.05); render();
  }else{
    sel=-1; moves=[]; render();
  }
}

function askPromotion(list){
  promoChoices=list;
  const box=$('promoPicks'); box.innerHTML='';
  for(const t of [QUEEN,ROOK,BISHOP,KNIGHT]){
    const mv=list.find(m=>mvPromo(m)===t); if(!mv) continue;
    const b=document.createElement('button'); b.className='ui';
    b.innerHTML=pieceSVG(t|(stm<<3))+'<span>'+NAME[t]+'</span>';
    b.onclick=()=>{ $('promoSheet').classList.remove('on'); promoChoices=null; doMove(mv); };
    box.appendChild(b);
  }
  $('promoSheet').classList.add('on');
}
$('promoCancel').onclick=()=>{ $('promoSheet').classList.remove('on'); promoChoices=null; sel=-1; moves=[]; render(); };

function doMove(mv){
  const legal=legalMoves();
  const san=moveToSAN(mv,legal);
  const captured= B[mvTo(mv)] || mvFlag(mv)===1;
  const side=stm;
  make(mv);
  record.push({mv,san,side});
  keys.push(posKey());
  lastMove=mv; animMove=mv; sel=-1; moves=[]; hintMove=null;
  beep(captured?300:660,.07);
  render(); drawLog();
  if(checkEnd()) return;
  if(!twoP() && stm!==human){ busy=true; setTimeout(aiMove,260); }
  else if(twoP()){
    const n=sideName(stm);
    if(inCheck(stm)) coach('將軍！'+n+'的國王被攻擊了，先救牠。','alert','危');
    else if(mvFlag(mv)===2) coach('王車易位完成！換 '+n+' 了。','',stm===0?'白':'黑');
    else if(mvPromo(mv)) coach('士兵升變成'+NAME[mvPromo(mv)]+'了！換 '+n+' 了。','',stm===0?'白':'黑');
    else coach('換 '+n+' 了。','', stm===0?'白':'黑');
  }
  else{
    if(inCheck(human)) coach('將軍！你的國王被攻擊了，先救牠。','alert','危');
    else if(mvFlag(mv)===1&&side!==human) coach('電腦用「吃過路兵」吃掉了你的兵，這也是正式規則喔。換你了。','','兵');
    else coach('換你了，點一顆棋子看看能走哪裡。');
  }
}

function aiMove(){
  const L=LEVELS[level], gid=gameId;
  coach(L.time>=2000? '電腦在認真想棋，稍等一下⋯⋯' : '電腦在想棋⋯⋯','','思');
  think(L.depth,L.time,L.slack,res=>{
    if(gid!==gameId) return;              // 已經開了新局或悔棋
    busy=false;
    if(!res){ checkEnd(); return; }
    let mv=res.mv;
    if(L.blunder>0 && Math.random()<L.blunder){
      const all=legalMoves(); mv=all[Math.random()*all.length|0];
    }else if(L.slack>0 && res.list && res.score<MATE-500){
      const good=res.list.filter(x=>x[1]>=res.score-L.slack);
      if(good.length) mv=good[Math.random()*good.length|0][0];
    }
    doMove(mv);
  });
}

function repeatCount(){ const k=keys[keys.length-1]; let n=0; for(const x of keys) if(x===k) n++; return n; }

function checkEnd(){
  const ms=legalMoves();
  const win=()=>{ beep(880,.12); setTimeout(()=>beep(1180,.16),130); };
  if(ms.length===0){
    over=true; moves=[]; render();
    if(inCheck(stm)){
      if(twoP()){ coach('將死！'+sideName(stm^1)+'贏了！'+sideName(stm)+'的國王無路可逃。','win','勝'); win(); }
      else if(stm===human) coach('這局被將死了。看看棋譜想想哪一步可以改，再來一盤！','alert','惜');
      else { coach('將死！太厲害了，你贏了這一局！','win','勝'); win(); }
    }else{
      coach('逼和！'+sideName(stm)+'沒有棋可以走，但國王沒有被將軍，這局算和棋。','','和');
    }
    return true;
  }
  let why='';
  if(half>=100) why='連續 50 回合沒有吃子、也沒有動兵，依規則算和棋。';
  else if(repeatCount()>=3) why='同一個局面出現了三次，依規則算和棋。';
  else if(insufficientMaterial()) why='雙方剩下的棋子都不夠將死對方，這局算和棋。';
  if(why){ over=true; moves=[]; render(); coach(why,'','和'); return true; }
  return false;
}

/* ---- 按鈕 ---- */
function startGame(h){
  gameId++;
  human=h;
  setupInitial(); sel=-1; moves=[]; record=[]; keys=[posKey()]; over=false; busy=false;
  lastMove=null; hintMove=null;
  drawBoard(); render(); drawLog();
  refreshMode();
  if(twoP()) coach('雙人對戰開始，白方先走。','','人');
  else if(human===0) coach('你執白棋，白棋先走。點一顆白色棋子，綠點就是牠能去的地方。','','王');
  else { coach('你執黑棋，棋盤已經轉過來了。白棋（電腦）先走。','','王'); busy=true; setTimeout(aiMove,400); }
}
$('btnNew').onclick=()=>{
  if(twoP()){ startGame(0); return; }
  $('newSub').textContent='對手：'+LEVELS[level].name+'。要執白棋還是黑棋？白棋先走。';
  $('newSheet').classList.add('on');
};
$('pickW').innerHTML=pieceSVG(KING)+'<span>執白（先走）</span>';
$('pickB').innerHTML=pieceSVG(KING|8)+'<span>執黑（後走）</span>';
$('pickW').onclick=()=>{ $('newSheet').classList.remove('on'); startGame(0); };
$('pickB').onclick=()=>{ $('newSheet').classList.remove('on'); startGame(1); };
$('newCancel').onclick=()=>$('newSheet').classList.remove('on');

$('btnUndo').onclick=()=>{
  if(busy||!record.length) return;
  let back=1;
  if(!twoP()){
    // 退回到「輪到玩家」的那一刻，而且至少退掉玩家自己的一步
    let i=record.length-1;
    while(i>=0 && record[i].side!==human) i--;
    if(i<0){ coach('你還沒有走棋，沒有可以悔的。'); return; }
    back=record.length-i;
  }
  gameId++;
  const keep=record.slice(0,record.length-back);
  setupInitial(); record=[]; keys=[posKey()];
  for(const h of keep){ make(h.mv); record.push(h); keys.push(posKey()); }
  over=false;
  lastMove=record.length? record[record.length-1].mv : null;
  sel=-1; moves=[]; hintMove=null;
  render(); drawLog();
  coach('好，退回去重想一步。');
};
$('btnHint').onclick=()=>{
  if(busy||over) return;
  if(!twoP() && stm!==human) return;
  busy=true; coach('讓我想想⋯⋯','','思');
  const gid=gameId;
  think(6,1200,0,res=>{
    if(gid!==gameId) return;
    busy=false;
    if(res){
      hintMove=res.mv; sel=-1; moves=[]; render();
      const p=B[mvFrom(res.mv)];
      coach('試試看這一步：'+moveToSAN(res.mv)+'（'+NAME[p&7]+' '+sqName(mvFrom(res.mv))+' → '+sqName(mvTo(res.mv))+'）','','提');
    }
  });
};
function modeName(){ return twoP()? '雙人' : LEVELS[level].name; }
function refreshMode(){
  $('btnLevel').textContent='對手：'+modeName();
  $('lvtag').textContent= twoP()? '雙人' : modeName()+'・執'+(human===0?'白':'黑');
}
$('btnLevel').onclick=()=>{
  level=(level+1)%(LEVELS.length+1);
  refreshMode(); drawBoard(); render();
  if(twoP()) coach('切換成雙人對戰，兩個人輪流在同一台裝置上下棋。','','人');
  else coach('對手換成「'+LEVELS[level].name+'」'+(level>=3?'，電腦會想比較久':'')+'。');
  if(!twoP() && !over && stm!==human && !busy){ busy=true; setTimeout(aiMove,260); }
};
$('btnSound').onclick=()=>{ sound=!sound; $('btnSound').textContent='音效：'+(sound?'開':'關'); };
$('btnGuide').onclick=()=>$('sheet').classList.add('on');
$('btnClose').onclick=()=>$('sheet').classList.remove('on');
for(const id of ['sheet','newSheet','promoSheet'])
  $(id).onclick=e=>{ if(e.target===$(id)){ if(id==='promoSheet') $('promoCancel').onclick(); else $(id).classList.remove('on'); } };

/* ---- 棋子圖鑑 ---- */
const TIPS={
  1:{n:'士兵（兵）',short:'士兵只能往前走一格，第一步可以走兩格；吃子要斜著往前吃。',
     long:'每次<span class="k">往前走一格</span>，還在原位時可以一次走兩格。吃子時是<span class="k">斜前方一格</span>。士兵永遠不能後退。'},
  2:{n:'騎士（馬）',short:'騎士走「L」字形，可以跳過其他棋子。',
     long:'先直走兩格再轉彎一格，像英文字母「L」。騎士是唯一<span class="k">可以跳過其他棋子</span>的棋子，不會被擋住。'},
  3:{n:'主教（象）',short:'主教斜著走，幾格都可以，只要路上沒有棋子擋著。',
     long:'沿著斜線走任意格數。每個主教<span class="k">一輩子都待在同一種顏色的格子</span>上，所以兩個主教要互相合作。'},
  4:{n:'城堡（車）',short:'城堡直走橫走都行，只要路上沒有棋子擋著。',
     long:'直線、橫線走幾格都可以，遇到第一顆棋子就停；如果那是對方的子，就可以吃掉。'},
  5:{n:'皇后（后）',short:'皇后直、橫、斜都能走，幾格都可以，是最有力氣的棋子。',
     long:'等於城堡加主教：<span class="k">八個方向走任意格數</span>。皇后很珍貴，不要隨便讓對方吃掉。'},
  6:{n:'國王（王）',short:'國王往任何方向走一格，但不能走到會被吃掉的地方。',
     long:'往八個方向<span class="k">走一格</span>。國王不能被吃，所以<span class="k">不能走到對方攻擊得到的格子</span>。'}
};
$('guide').innerHTML=[6,5,4,3,2,1].map(t=>
  `<div class="card"><div class="chip">${pieceSVG(t)}</div>
   <div><h3>${TIPS[t].n}</h3><p>${TIPS[t].long}</p></div></div>`).join('')
 +`<div class="card"><div class="chip" style="font-size:18px">易</div>
   <div><h3>王車易位</h3><p>國王和城堡都還沒動過、中間沒有棋子、國王<span class="k">沒有被將軍、經過的格子也沒被攻擊</span>時，國王可以往城堡的方向走兩格，城堡跳到國王的另一邊。短易位記作 O-O，長易位記作 O-O-O。</p></div></div>`
 +`<div class="card"><div class="chip" style="font-size:18px">過</div>
   <div><h3>吃過路兵</h3><p>對方的兵從原位<span class="k">一次走兩格</span>，剛好停在你的兵旁邊時，你可以在<span class="k">下一步</span>斜走到牠經過的那一格，把牠吃掉。錯過這一步就不能再吃了。</p></div></div>`
 +`<div class="card"><div class="chip" style="font-size:18px">升</div>
   <div><h3>兵升變</h3><p>士兵走到對面的底線時，<span class="k">一定要變成</span>皇后、城堡、主教或騎士其中一種，大多數時候選皇后。</p></div></div>`
 +`<div class="card"><div class="chip" style="color:#4E9E7E">勝</div>
   <div><h3>怎樣算贏</h3><p>國王被攻擊叫「將軍」，你<span class="k">一定要先化解</span>。如果國王被將軍而且怎麼走都救不了，叫「將死」，就輸了。</p></div></div>`
 +`<div class="card"><div class="chip" style="color:#4E9E7E">和</div>
   <div><h3>怎樣算和棋</h3><p>輪到的一方<span class="k">沒被將軍卻沒有棋可以走</span>（逼和）；雙方連續 50 回合沒吃子也沒動兵；同一局面出現三次；或雙方剩下的棋子都不可能將死對方。</p></div></div>`;
